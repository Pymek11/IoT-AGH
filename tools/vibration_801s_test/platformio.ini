; Bring-up test for the 801S digital vibration sensor on the XIAO ESP32S3.
; Upload: pio run -d tools/vibration_801s_test -t upload     Monitor: pio device monitor -d tools/vibration_801s_test
; NOTE: this replaces whatever firmware is on the board (e.g. the LoRa node) - reflash it afterwards.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
