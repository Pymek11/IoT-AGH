[platformio]
; Indicate that the source files are located in the main project directory (./Source)
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor baud rate (for the logger)
monitor_speed = 115200

; Configuration for the native USB port on ESP32-S3 (to route logs through USB CDC)
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_XIAO_ESP32S3

; Explicitly instruct PlatformIO where to look for modules in subdirectories
build_src_filter = +<*> +<modules/*> +<utils/*>

; Classic ESP32 DevKit V1 (ESP32-WROOM-32) - logs go through the onboard USB-UART bridge, no USB CDC flags needed
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DBOARD_ESP32_DEVKIT
build_src_filter = +<*> +<modules/*> +<utils/*>