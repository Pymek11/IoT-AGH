[platformio]
; Indicate that the source files are located in the main project directory (./Source)
src_dir = .

; Serial speed shared by the serial monitor and the logger (passed to the code as SERIAL_BAUD)
[common]
serial_baud = 115200 ; for normal modes
; serial_baud = 921600 ; when recording raw data thru serial

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor baud rate (for the logger)
monitor_speed = ${common.serial_baud}

; Configuration for the native USB port on ESP32-S3 (to route logs through USB CDC)
build_flags =
    -DSERIAL_BAUD=${common.serial_baud}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_XIAO_ESP32S3
    ; -DMIC_STREAM

; Explicitly instruct PlatformIO where to look for modules in subdirectories
build_src_filter = +<*> +<modules/*> +<utils/*>

; Classic ESP32 DevKit V1 (ESP32-WROOM-32) - logs go through the onboard USB-UART bridge, no USB CDC flags needed
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.serial_baud}
build_flags =
    -DSERIAL_BAUD=${common.serial_baud}
    -DBOARD_ESP32_DEVKIT
    ; -DMIC_STREAM
build_src_filter = +<*> +<modules/*> +<utils/*>