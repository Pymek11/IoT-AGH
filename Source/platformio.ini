[platformio]
; Indicate that the source files are located in the main project directory (./Source)
src_dir = .
; This branch is for recording: `pio run` builds the recorder only, pass -e for the other environments
default_envs = esp32dev-rec

[common]
; Serial speed shared by the serial monitor and the logger (passed to the code as SERIAL_BAUD)
serial_baud = 115200 ; for normal mode
; serial_baud = 921600 ; when recording raw data thru serial (MIC_STREAM / MIC_DUAL_STREAM)

; Firmware mode, shared by both boards. Empty = engine detection. Optional flags:
;   -DDETECTOR_DEBUG     also log the detector features once a second
;   -DMIC_STREAM         stream filtered samples to capture.py instead of detecting (921600 baud)
;   -DMIC_DUAL_STREAM    stream raw + filtered samples to capture.py instead of detecting (921600 baud)
mode_flags =

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor baud rate (for the logger)
monitor_speed = ${common.serial_baud}

; Configuration for the native USB port on ESP32-S3 (to route logs through USB CDC)
build_flags =
    -DSERIAL_BAUD=${common.serial_baud}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_XIAO_ESP32S3
    ${common.mode_flags}

; Explicitly instruct PlatformIO where to look for modules in subdirectories
build_src_filter = +<*> +<modules/*> +<utils/*> -<external_tools/mic_tests/.venv/>

; Classic ESP32 DevKit V1 (ESP32-WROOM-32) - logs go through the onboard USB-UART bridge, no USB CDC flags needed
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.serial_baud}
build_flags =
    -DSERIAL_BAUD=${common.serial_baud}
    -DBOARD_ESP32_DEVKIT
    ${common.mode_flags}
build_src_filter = +<*> +<modules/*> +<utils/*> -<external_tools/mic_tests/.venv/>

; ESP32 DevKit V1 recorder: microphone + 801S streamed to external_tools/recorder/rec_capture.py
; pio run -e esp32dev-rec -t upload
[env:esp32dev-rec]
extends = env:esp32dev
monitor_speed = 921600
build_flags =
    -DSERIAL_BAUD=921600
    -DBOARD_ESP32_DEVKIT
    -DMIC_REC

; ESP32 DevKit V1, 801S diagnostics: prints the pin level as text (pio device monitor -e esp32dev-vibdiag)
[env:esp32dev-vibdiag]
extends = env:esp32dev
monitor_speed = 115200
build_flags =
    -DSERIAL_BAUD=115200
    -DBOARD_ESP32_DEVKIT
    -DVIB_DIAG
