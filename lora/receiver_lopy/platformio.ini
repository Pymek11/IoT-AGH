; LoRa receiver + ThingsBoard gateway: Pycom LoPy 1.0 (ESP32 + SX1272)
; Build:  pio run -d lora/receiver_lopy        Upload: pio run -d lora/receiver_lopy -t upload
; Upload needs G23 bridged to GND (bootloader mode); remove the wire and reset afterwards.
; Before building: copy include/secrets.example.h to include/secrets.h and fill it in.

[env:lopy]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
    knolleary/PubSubClient@^2.8
build_flags =
    -I../common
