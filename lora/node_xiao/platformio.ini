; LoRa sensor node: XIAO ESP32S3 + Wio-SX1262 + INMP441 microphone + 801S vibration sensor.
; Reuses the microphone / filter / logger modules from ../../Source.
;
;   pio run -d lora/node_xiao -e xiao_esp32s3_bench -t upload   bench test, no deep sleep, serial log stays connected
;   pio run -d lora/node_xiao -e xiao_esp32s3 -t upload         real behaviour with deep sleep
;
; In deep sleep the USB port disappears. To flash again: hold BOOT, tap RESET, release BOOT (download mode),
; or flash the bench environment while the board is awake.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
build_flags =
    -I../common
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_XIAO_ESP32S3
    -DSENSOR_ID=4
    ; -DSOUND_RMS_THRESHOLD=0.004f      ; sound level that counts as an event, tune from the serial log
    ; -DSOUND_REQUIRE_ENGINE_BAND=1     ; only engine-like sound, ignore claps and voices
build_src_filter =
    +<*>
    +<../../../Source/modules/microphone/mic.cpp>
    +<../../../Source/utils/filter/filter.cpp>
    +<../../../Source/utils/logger/logger.cpp>

[env:xiao_esp32s3_bench]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DNODE_BENCH
