; LoRa sensor node: XIAO ESP32S3 + Wio-SX1262 kit
; Build:  pio run -d lora/node_xiao        Upload: pio run -d lora/node_xiao -t upload

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
build_flags =
    -I../common
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSENSOR_ID=4
